# build-binaries.yml — Build per-platform static tmux binaries. Does NOT publish.
#
# Triggers:
#   - PRs to main: build only (verify the static tmux still compiles)
#   - release tag (v*): build, so the artifacts exist when you publish
#   - workflow_dispatch: build on demand
#
# Each matrix job builds tmux for ITS platform and uploads it as an artifact.
# There is no cross-compiling these locally, which is the whole point of the
# matrix — a macOS runner cannot produce the Linux binaries and vice versa.
#
# Publishing @octomux/tmux-* is manual, same as the CLI packages (see
# CONTRIBUTING.md → Publishing). To ship a platform:
#
#   gh run download <run-id> -n tmux-linux-x64 -D packages/tmux-linux-x64
#   cd packages/tmux-linux-x64
#   chmod +x bin/tmux
#   npm version <x.y.z> --no-git-tag-version --allow-same-version
#   npm publish --access public
#
# Each package is independent — an unavailable runner (e.g. macos-13 Intel) only
# holds up its own platform. Publishing is idempotent in the sense that npm
# refuses a version that already exists, so re-running a partial release is safe.
#
# NOTE: node-pty delivery is intentionally NOT handled here. npm/CLI users get
# node-pty from upstream (Linux compiles from source — a known gap), and the
# Electron app rebuilds node-pty for its ABI at package time via electron-builder
# (npmRebuild). Wiring our own node-pty prebuilds into the install is a separate
# TODO and must consume them somewhere.

name: Build Binaries

on:
  # Deliberately NO 'push: branches: [main]' — PRs already verify the tmux build,
  # and a 4-platform matrix on every main commit just floods the (concurrency-
  # capped) macOS/arm64 runner queue for no added signal.
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - runner: macos-14
            platform: darwin
            arch: arm64

          # macOS x64 (Intel)
          - runner: macos-13
            platform: darwin
            arch: x64

          # Linux x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64

          # Linux arm64
          # NOTE: 'ubuntu-24.04-arm' is GitHub's hosted arm64 runner label.
          # If unavailable, replace with a self-hosted arm64 runner or QEMU emulation.
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl bzip2 zlib1g-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          # Xcode CLT provides clang + make. pkg-config needed for configure checks.
          brew install pkg-config || true

      - name: Build tmux binary
        run: bash scripts/build-tmux.sh

      # Retained long enough to outlive a release that gets published by hand
      # days after the tag — these are the only copies of the Linux builds.
      - name: Upload tmux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/tmux-${{ matrix.platform }}-${{ matrix.arch }}/
          retention-days: 90
