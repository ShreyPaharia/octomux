# Creates the GitHub release for a v* tag. It does NOT publish to npm.
#
# npm publishing is manual and deliberately so — OIDC trusted publishing never
# worked here, and a half-finished automated run is worse than none: the root
# package landed on npm ahead of its platform binaries in 1.4.0 and every
# non-arm64-mac install broke until the rest caught up.
#
# To cut a release:
#
#   npm version <x.y.z> --no-git-tag-version && git commit -am "chore(release): <x.y.z>"
#   bun run build:npm                   # 6 binaries -> dist-npm/, pins the root manifest
#   for d in dist-npm/*/; do npm publish "$d" --access public; done
#   npm publish --ignore-scripts        # root LAST: its optionalDependencies pin the above
#   git checkout package.json           # drop the release-time pins
#   git tag -a v<x.y.z> -m "..." && git push origin main v<x.y.z>
#
# Then verify before calling it done — `npm publish` reports success while the
# registry read path 404s for a few minutes, so check the install, not the log:
#
#   npm i --prefix /tmp/smoke octomux@latest && /tmp/smoke/node_modules/.bin/octomux --help
#
# Note: build-binaries.yml still auto-publishes the @octomux/tmux-* packages on
# the same v* tag. That is a separate set of packages from the CLI binaries.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # electron-release.yml runs on the same v* tag and its
      # `electron-builder --publish always` (releaseType: release) creates the
      # release too if it gets there first. softprops/action-gh-release lost that
      # race and hard-failed with
      #   Validation Failed: {"resource":"Release","code":"already_exists"}.
      # Create-or-adopt instead: both sides create a PUBLISHED release, so
      # whichever one exists is the right one to attach artifacts to.
      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — adopting it"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              || gh release view "$GITHUB_REF_NAME"
          fi
