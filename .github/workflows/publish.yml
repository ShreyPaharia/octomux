name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - name: Sync version from git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            npm version "$TAG_VERSION" --no-git-tag-version
          else
            echo "package.json already at $PKG_VERSION; skipping bump"
          fi

      # Builds all six platform binaries and stages one npm package per target
      # in dist-npm/. Signing is skipped on Linux (codesign is macOS-only) — run
      # `bun run sign:macos` on a macOS runner if you ship outside npm.
      - run: bun run build:npm

      # Platform packages first: the root package's optionalDependencies pin this
      # exact version, so publishing it before them would resolve to nothing.
      - name: Publish platform packages
        run: |
          for pkg in dist-npm/*/; do
            echo "publishing $pkg"
            npm publish "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Publish root package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
